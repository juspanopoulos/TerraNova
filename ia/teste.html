<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TerraNova IA - Teste</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        section {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>
<body>

<h1>TerraNova IA - Testes</h1>

<!-- ML1 -->

<section>

    <h2>ML1 - Produtividade</h2>

    <select id="region">
        <option>North</option>
        <option>South</option>
        <option>East</option>
        <option>West</option>
    </select>

    <select id="soil_type">
        <option>Clay</option>
        <option>Loam</option>
        <option>Peaty</option>
        <option>Sandy</option>
        <option>Silt</option>
    </select>

    <select id="crop">
        <option>Rice</option>
        <option>Wheat</option>
        <option>Maize</option>
        <option>Cotton</option>
        <option>Soybean</option>
    </select>

    <select id="weather_condition">
        <option>Sunny</option>
        <option>Rainy</option>
    </select>

    <input type="number" id="rainfall_mm" placeholder="Rainfall mm" value="1200">

    <input type="number" id="temperature_celsius" placeholder="Temperatura" value="28">

    <input type="number" id="fertilizer_used" value="1">

    <input type="number" id="irrigation_used" value="1">

    <input type="number" id="days_to_harvest" value="120">

    <button onclick="testarML1()">
        Testar ML1
    </button>

    <pre id="resultado_ml1"></pre>

</section>

<!-- ML2 -->

<section>

    <h2>ML2 - Irrigação</h2>

    <input type="number" step="any"
           id="latitude"
           value="-23.5505">

    <input type="number" step="any"
           id="longitude"
           value="-46.6333">

    <select id="soil_type2">
        <option>Clay</option>
        <option>Loam</option>
        <option>Sandy</option>
        <option>Silt</option>
        <option>Peaty</option>
        <option>Chalky</option>
    </select>

    <input type="number"
           id="soil_moisture"
           value="45">

    <select id="crop_type">
        <option>Rice</option>
        <option>Wheat</option>
        <option>Maize</option>
        <option>Cotton</option>
    </select>

    <select id="crop_growth_stage">
        <option>Germination</option>
        <option>Vegetative</option>
        <option>Flowering</option>
        <option>Maturity</option>
    </select>

    <select id="irrigation_type">
        <option>Drip</option>
        <option>Sprinkler</option>
        <option>Surface</option>
    </select>

    <input type="number"
           id="field_area_hectare"
           value="10">

    <select id="mulching_used">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <input type="number"
           id="previous_irrigation_mm"
           value="30">

    <input type="number"
           id="current_water_usage"
           value="8">

    <button onclick="testarML2()">
        Testar ML2
    </button>

    <pre id="resultado_ml2"></pre>

</section>

<script>

const API = "http://localhost:5000";

async function testarML1() {

    const payload = {

        region:
            document.getElementById("region").value,

        soil_type:
            document.getElementById("soil_type").value,

        crop:
            document.getElementById("crop").value,

        weather_condition:
            document.getElementById("weather_condition").value,

        rainfall_mm:
            Number(document.getElementById("rainfall_mm").value),

        temperature_celsius:
            Number(document.getElementById("temperature_celsius").value),

        fertilizer_used:
            Number(document.getElementById("fertilizer_used").value),

        irrigation_used:
            Number(document.getElementById("irrigation_used").value),

        days_to_harvest:
            Number(document.getElementById("days_to_harvest").value)
    };

    const response = await fetch(
        `${API}/modelo1/predict`,
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify(payload)
        }
    );

    const data = await response.json();

    document.getElementById(
        "resultado_ml1"
    ).textContent =
        JSON.stringify(data, null, 2);
}

async function testarML2() {

    const payload = {

        latitude:
            Number(document.getElementById("latitude").value),

        longitude:
            Number(document.getElementById("longitude").value),

        soil_type:
            document.getElementById("soil_type2").value,

        soil_moisture:
            Number(document.getElementById("soil_moisture").value),

        crop_type:
            document.getElementById("crop_type").value,

        crop_growth_stage:
            document.getElementById("crop_growth_stage").value,

        irrigation_type:
            document.getElementById("irrigation_type").value,

        field_area_hectare:
            Number(document.getElementById("field_area_hectare").value),

        mulching_used:
            document.getElementById("mulching_used").value,

        previous_irrigation_mm:
            Number(document.getElementById("previous_irrigation_mm").value),

        current_water_usage:
            Number(document.getElementById("current_water_usage").value)
    };

    const response = await fetch(
        `${API}/modelo2/predict`,
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify(payload)
        }
    );

    const data = await response.json();

    document.getElementById(
        "resultado_ml2"
    ).textContent =
        JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
