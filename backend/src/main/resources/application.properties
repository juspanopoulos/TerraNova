quarkus.application.name=terranova-api
quarkus.http.port=8080

quarkus.datasource.db-kind=oracle
quarkus.datasource.username=${ORACLE_USER:terranova}
quarkus.datasource.password=${ORACLE_PASSWORD:terranova}
quarkus.datasource.jdbc.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

quarkus.rest-client.terranova-ia.url=${IA_BASE_URL:http://localhost:5000}
quarkus.rest-client.terranova-ia.connect-timeout=5000
quarkus.rest-client.terranova-ia.read-timeout=30000

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.info-title=TerraNova API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=API RESTful do TerraNova para Oracle, dashboard e integracao com IA.

terranova.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
terranova.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
terranova.cors.allowed-headers=Content-Type,Authorization
