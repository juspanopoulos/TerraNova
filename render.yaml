services:
  - type: web
    name: terranova-ia
    runtime: docker
    rootDir: ia
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: terranova-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ORACLE_JDBC_URL
        value: jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: IA_HOSTPORT
        fromService:
          type: web
          name: terranova-ia
          property: hostport
      - key: NASA_POWER_BASE_URL
        value: https://power.larc.nasa.gov
      - key: CORS_ALLOWED_ORIGINS
        sync: false
